# =====================================================================
# lab.conf - DNS interne du Secure Network Lab (dnsmasq sur gw)
# =====================================================================

# --- Où écouter : uniquement sur la DMZ et le LAN, jamais sur le WAN ---
interface=ens37
interface=ens38
bind-interfaces

# --- Serveur amont : à qui transmettre les noms inconnus ---
no-resolv
server=192.168.204.2

# --- Ne pas lire /etc/hosts de gw ---
no-hosts

# --- Domaine du lab ---
domain=lab.internal
local=/lab.internal/

# --- Annuaire des machines (nom complet, nom court, IP) ---
host-record=gw.lab.internal,gw,10.10.20.1
host-record=gw-dmz.lab.internal,gw-dmz,10.10.10.1
host-record=web.lab.internal,web,10.10.10.10
host-record=client.lab.internal,client,10.10.20.10
host-record=mon.lab.internal,mon,10.10.20.20

# --- Journaliser les requêtes (pour les preuves et le dépannage) ---
log-queries