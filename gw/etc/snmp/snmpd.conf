# =====================================================================
# snmpd.conf - Agent SNMP de gw (Secure Network Lab)
# SNMP v3 uniquement, lecture seule, authentification + chiffrement
# =====================================================================

# Écouter uniquement sur le LAN (là où se trouve mon), jamais sur le WAN
agentaddress udp:10.10.20.1:161

# Informations d'identification de l'équipement
sysName     gw
sysLocation Secure Network Lab - VMware Workstation
sysContact  admin@lab.internal

# Ce qui peut être lu : les informations standard + CPU/mémoire/disque
view lecture included .1.3.6.1.2.1
view lecture included .1.3.6.1.4.1.2021

# Un seul utilisateur, en lecture seule, chiffrement obligatoire
rouser zbxmon priv -V lecture