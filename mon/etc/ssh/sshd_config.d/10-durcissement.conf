# =====================================================================
# 10-durcissement.conf - Durcissement SSH (Secure Network Lab)
# =====================================================================

# Authentification : uniquement par clé
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# Pas de connexion directe en root
PermitRootLogin no

# Limiter les tentatives
MaxAuthTries 3
LoginGraceTime 30

# Fonctions inutiles désactivées
X11Forwarding no
AllowTcpForwarding no

# Qui peut se connecter, et d'où : uniquement depuis gw (rebond)
AllowUsers bouaroua@10.10.20.1